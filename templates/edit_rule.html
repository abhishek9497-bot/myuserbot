<!doctype html><html lang="en"><head><meta charset="utf-8"><title>{{ 'Edit' if rule else 'Add' }} rule - NewAISeller</title><style>{% include 'style.css' %}</style></head><body><nav><strong>NewAISeller</strong><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('rules') }}">Rules</a></nav><main><header><p class="eyebrow">RULE CONFIGURATION</p><h1>{{ 'Edit' if rule else 'Add' }} rule</h1></header><form class="panel form" method="post" enctype="multipart/form-data"><label>Rule name<input name="name" required value="{{ rule.name if rule else '' }}"></label><label>Keywords <small>Comma-separated</small><textarea name="keywords" required>{{ rule.keywords_list|join(', ') if rule else '' }}</textarea></label><label>Match type<select name="match_type">{% for option in ['ANY_KEYWORD','CONTAINS','EXACT'] %}<option {{ 'selected' if (rule and rule.match_type == option) or (not rule and option == 'ANY_KEYWORD') }}>{{ option }}</option>{% endfor %}</select></label><label>Reply text<textarea name="reply_text">{{ rule.reply_text if rule else '' }}</textarea></label><div class="grid"><label>Priority<input type="number" name="priority" value="{{ rule.priority if rule else 0 }}"></label><label>Cooldown number<input type="number" min="0" name="cooldown_number" value="{{ (rule.cooldown_seconds // 3600) if rule and rule.cooldown_seconds >= 3600 else ((rule.cooldown_seconds // 60) if rule and rule.cooldown_seconds >= 60 else (rule.cooldown_seconds if rule else 0)) }}"></label><label>Cooldown unit<select name="cooldown_unit"><option value="seconds">Seconds</option><option value="minutes" {{ 'selected' if rule and rule.cooldown_seconds >= 60 and rule.cooldown_seconds < 3600 }}>Minutes</option><option value="hours" {{ 'selected' if rule and rule.cooldown_seconds >= 3600 }}>Hours</option></select></label></div><label class="checks"><span><input type="checkbox" name="send_text" {{ 'checked' if not rule or rule.send_text }}> Send text</span><span><input type="checkbox" name="send_image" {{ 'checked' if rule and rule.send_image }}> Send image</span><span><input type="checkbox" name="enabled" {{ 'checked' if not rule or rule.enabled }}> Enabled</span></label><label>Image<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp">{% if rule and rule.image_path %}<small>Current: {{ rule.image_path }} <label><input type="checkbox" name="remove_image"> Remove image</label></small>{% endif %}</label><div class="form-actions"><a href="{{ url_for('rules') }}">Cancel</a><button class="button accent" type="submit">Save rule</button></div></form></main></body></html>
